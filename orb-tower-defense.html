<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>オーブタワーディフェンス</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#777;--card:#f1f1f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#f2f2f2;--mut:#999;--card:#242424}}
:root[data-theme="dark"]{--bg:#121212;--fg:#f2f2f2;--mut:#999;--card:#242424}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:480px;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:8px}
#top{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center;font-size:12px}
#top b{display:block;font-size:16px}
#evo{margin:6px 0;font-size:12px;color:var(--mut);min-height:34px}
canvas{width:100%;height:110px;display:block;border-top:4px solid var(--fg);border-bottom:4px solid var(--fg)}
#bot{display:flex;gap:8px;margin-top:10px;align-items:center}
#orbs{width:96px;flex:none;text-align:center;font-size:11px}
#arc{border:4px solid var(--fg);border-radius:50px 0 0 50px;padding:6px 4px;display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:2px}
.slot{width:30px;height:30px;border-radius:50%;border:3px solid var(--fg);background:transparent;padding:0}
#grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);border:3px solid var(--fg)}
.cell{aspect-ratio:1;border:2px solid var(--fg);background:var(--bg);color:var(--fg);font-size:11px;padding:2px;line-height:1.25;cursor:pointer}
.cell.sel{background:var(--card);outline:3px solid #e53935;outline-offset:-3px}
.dots{display:flex;gap:2px;justify-content:center;margin-top:3px}
.dots i{width:9px;height:9px;border-radius:50%;border:1px solid var(--fg)}
button{font:inherit;color:var(--fg);background:var(--card);border:1.5px solid var(--fg);border-radius:8px;padding:6px 8px;margin:2px}
#panel{margin-top:10px;background:var(--card);border-radius:10px;padding:8px}
h4{margin:0 0 4px;font-size:13px}
.row{display:flex;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px}
.chip i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid var(--fg)}
.zap{position:relative;animation:zp .3s steps(2) infinite}
.zap::after{content:"⚡";position:absolute;left:50%;top:50%;font-size:20px;line-height:1;pointer-events:none;animation:zb .45s steps(1) infinite}
.chip .zap::after{font-size:12px}
@keyframes zp{0%{box-shadow:0 0 6px 1px #ffee58,0 0 10px 3px #7e57c2}50%{box-shadow:0 0 14px 4px #fff,0 0 24px 8px #29b6f6}100%{box-shadow:0 0 8px 2px #ffee58,0 0 16px 5px #ab47bc}}
@keyframes zb{0%{transform:translate(-50%,-50%) rotate(-12deg);opacity:1}30%{transform:translate(-30%,-60%) rotate(15deg) scale(1.3);opacity:.4}60%{transform:translate(-60%,-40%) rotate(-5deg);opacity:1}80%{opacity:0}}
small{color:var(--mut)}
.zap::after{content:none!important;animation:none}
#title{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--fg);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px;text-align:center}
#title h1{font-size:28px;margin:24px 0}
.mc{max-width:440px;margin:14px auto;padding:12px;border:2px solid var(--fg);border-radius:12px;text-align:left}
.mc h4{font-size:17px}
#title{background:#0b0b2e;color:#fff}#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;border:0}
#tc{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100%}
.mc{background:rgba(255,255,255,.1);border-color:#fff;backdrop-filter:blur(3px)}.mc small{color:#d1c4e9}.mc button{background:#fff;color:#111;border-color:#fff}
#lg{margin-top:auto;padding:28px 0 10px}
#lg img{width:min(70%,300px);filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 20px #7e57c2);animation:lgf 3s ease-in-out infinite}
@keyframes lgf{50%{transform:translateY(-6px);filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 30px #29b6f6)}}.mc button{margin:8px 6px 0 0;padding:10px 12px}
#top div{border-radius:10px;padding:4px 2px;color:#fff;background:linear-gradient(135deg,#7e57c2,#26c6da)}
#top div:nth-child(1){background:linear-gradient(135deg,#ff9800,#ffd54f)}
#top div:nth-child(2){background:linear-gradient(135deg,#43a047,#9ccc65)}
#top div:nth-child(3){background:linear-gradient(135deg,#e53935,#ff8a80)}
#top div:nth-child(4){background:linear-gradient(135deg,#8e24aa,#ce93d8)}
#top div:nth-child(5){background:linear-gradient(135deg,#1e88e5,#4dd0e1)}
.cell svg{animation:bob 1.6s ease-in-out infinite}.cell:nth-child(2n) svg{animation-delay:-.5s}.cell:nth-child(3n) svg{animation-delay:-1s}
@keyframes bob{50%{transform:translateY(-3px)}}
#title h1{background:linear-gradient(90deg,#ff5252,#ffca28,#66bb6a,#29b6f6,#ab47bc,#ff5252);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gs 4s linear infinite}
@keyframes gs{to{background-position:200% 0}}
#wv button:not(:disabled){animation:pl 1.2s infinite}
@keyframes pl{50%{box-shadow:0 0 16px 3px #e53935}}
#panel{border:2px solid var(--fg)}
.bolt{position:absolute;pointer-events:none;overflow:visible;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #7e57c2)}
.bolt path{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:miter;opacity:0;animation:bf .6s steps(1) infinite}
.bolt path:nth-child(2){animation-delay:-.1s}.bolt path:nth-child(3){animation-delay:-.2s}.bolt path:nth-child(4){animation-delay:-.3s}.bolt path:nth-child(5){animation-delay:-.4s}.bolt path:nth-child(6){animation-delay:-.5s}
@keyframes bf{0%{opacity:1}12%{opacity:0}30%{opacity:.9}42%{opacity:0}}
</style></head><body>
<div id="title"><canvas id="sky"></canvas><div id="tc"></div></div>
<div id="top"></div>
<div id="evo"></div>
<canvas id="cv"></canvas>
<div style="display:flex;gap:6px;margin:6px 0"><div id="wv" style="flex:1"></div><button onclick="suspend()">中断</button></div>
<div id="bot"><div id="orbs"></div><div id="grid"></div></div>
<div id="panel"></div>
<script>
const O={s:{n:'スピード',c:'#29b6f6',p:30},p:{n:'パワー',c:'#ef5350',p:40},e:{n:'進化',c:'#66bb6a',p:50},m:{n:'メガ',c:'#ab47bc'},g:{n:'ギガ',c:'#ffa726'},f:{n:'ファイナル',c:'#ffd600'},v:{n:'ボイド',c:'#3949ab',p:200},b:{n:'ブラックホール',c:'#000'}};
const T={n:{n:'ノーマル',d:10,r:1,g:30,rg:170},s:{n:'スピード',d:4,r:3,g:50,rg:150},l:{n:'連結',d:8,r:1,g:70,rg:160},p:{n:'パワー',d:40,r:.4,g:60,rg:200}};
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d');let W=380,H=110,S,qty=1,last=0,acc=0;let TL=1;const INF=()=>S&&S.mode=='inf';
function init(m){S={mode:m||'n',ls:[],dm:{t:0},gold:200,acc:0,dps:0,dw:0,dt:0,dcd:0,dia:0,dz:[],ex:[],orb:[],run:0,wave:0,life:20,evo:0,cells:Array(9).fill(null),inv:{s:0,p:0,e:0,m:0,g:0,f:0,v:0,b:0},mu:0,gu:0,sel:-1,en:[],q:0,sp:0,next:2,beams:[],fl:[],msg:'',over:0};render()}
function fmt(n){if(n<1e4)return Math.round(n)+'';const u=['','K','M','B','T','Qa','Qi'];let i=0;while(n>=1000&&i<u.length-1){n/=1000;i++}return n>=1000?n.toExponential(2):n.toFixed(n<10?2:1)+u[i]}
function st(c,i){const B=S.evo>=25?1.05:1;let sp=0,pw=0;
for(const k of S.orb){if(k=='s')sp+=.1;if(k=='p')pw+=.2;if(k=='m'){sp+=.2;pw+=.2}if(k=='g'){sp+=.8;pw+=.8}if(k=='f'){sp+=5;pw+=5}}
if(c.t=='l'){const x=i%3,y=i/3|0;let n=0;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const X=x+a,Y=y+b;if(X>=0&&X<3&&Y>=0&&Y<3&&S.cells[Y*3+X]&&(!INF()||S.cells[Y*3+X].t=='l'))n++});sp+=(INF()?1:.15)*n;pw+=(INF()?1:.25)*n}
let d=T[c.t].d*(1+pw*B)*(S.evo>=1000?11:1);if(S.evo>=9999)d*=1+.01*c.shots;if(S.evo>9999)d*=1+.1*(S.evo-9999);
return{d,r:T[c.t].r*(1+sp*B)}}
const tx=i=>W*(.38+.6*((i%3)+.5)/3);
function startWave(){if(S.over||S.run)return;spawnWave();render()}
function spawnWave(){S.run=1;S.wave++;S.q=Math.min(6+S.wave*2,40);S.sp=0;S.hp=S.mode=='inf'?30*Math.pow(1.3,S.wave-1):30*Math.pow(1.12,S.wave-1)*(S.wave>20?Math.pow(1.1,S.wave-20):1)}
function toast(m){S.msg=m;setTimeout(()=>{if(S.msg==m){S.msg='';stats()}},1500);stats()}
function tick(dt){if(S.over||TL)return;for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;if(p.t<=0)PT.splice(i,1)}S.dw+=dt;if(S.dw>=.5){S.dps=S.dps*.5+S.acc/S.dw*.5;S.acc=0;S.dw=0}
if(S.q>0){S.sp-=dt;if(S.sp<=0){S.sp=.9;const boss=S.wave%10==0&&S.q==1;const hp=S.hp*(boss?8:1);S.en.push({x:W,hp,mx:hp,v:38+Math.min(S.wave,30)*.8-(boss?10:0),boss});S.q--}}
else if(S.run&&!S.en.length){S.run=0;render()}
for(const e of S.en){e.x-=e.v*dt;if(e.x<=0){e.dead=1;S.life--;if(S.life<=0){S.over=1;S.msg='ゲームオーバー(ウェーブ'+S.wave+')'}}}
S.en=S.en.filter(e=>!e.dead);
S.cells.forEach((c,i)=>{if(!c)return;c.cd-=dt;if(c.cd>0)return;const x=tx(i),dy=40+(i/3|0)*25,rg=T[c.t].rg;
let tg=null;for(const e of S.en){if(Math.hypot(e.x-x,dy)<=rg&&(!tg||e.x<tg.x))tg=e}
const s=st(c,i);c.cd=1/s.r;if(!tg)return;c.shots++;
let d=s.d,cr=0,big=0,kill=0;if(S.evo>=50&&Math.random()<(S.evo>=100?.5:.1)){d*=S.evo>=5000?80:5;cr=1}
for(const k of S.orb){if(k=='v'&&Math.random()<.07){d*=50;big=1}if(k=='b'){if(Math.random()<.3){d*=100;big=1}if(Math.random()<.2)kill=1}}
const aoe=S.evo>=10||(INF()&&c.t=='p');const hit=aoe?S.en.filter(e=>Math.abs(e.x-tg.x)<=70):[tg];
for(const e of hit){const dd=INF()&&c.t=='p'?Math.max(d,e.hp*.15):d;S.acc+=Math.max(0,Math.min(dd,e.hp));e.hp-=dd}if(kill){S.acc+=Math.max(0,tg.hp);tg.hp=0}
if(INF()&&c.t=='n'&&c.shots%10==0){for(const e of S.en){if(e.hp<=0)continue;const L=e.hp*.5;S.acc+=L;e.hp-=L;S.fl.push({x:e.x,y:H-20,t:.6,s:fmt(L),cr:1})}S.ls.push({ex:W,t:.25})}
if((S.evo>=10||(INF()&&c.t=='p'))&&S.ex.length<25)S.ex.push({x:tg.x,t:.4,a:Math.random()*6});
S.beams.push({x,ex:tg.x,t:.08,cr});S.fl.push({x:tg.x,y:H-20,t:.6,s:kill?'即死!':fmt(d),cr:cr||big});
});
for(const e of S.en)if(e.hp<=0){e.dead=1;burst(e.x,e.boss?'#ce93d8':'#ff8a65');S.gold+=2+Math.floor(S.wave*1.5)*(e.boss?5:1);if(S.evo>=500&&S.orb.includes('b'))S.dia++}
S.en=S.en.filter(e=>!e.dead);
if(INF())S.cells.forEach((c,i)=>{if(!c||c.t!='s')return;const x=tx(i);for(const e of S.en)if(e.hp>0&&Math.abs(e.x-x)<48){const v=Math.min(e.hp,e.mx*.01*dt);e.hp-=v;S.acc+=v}});
if(S.dt&&INF()){S.dm.t-=dt;if(S.dm.t<=0){const X=W*.3,e=S.en.find(e=>Math.abs(e.x-X)<14);if(e){S.acc+=Math.max(0,e.hp);e.hp=0;S.dm.t=.3;S.dz.push({x:X,t:.4})}}}
if(S.dt&&!INF()){S.dcd-=dt;if(S.dcd<=0&&S.en.length){let tg=S.en[0];for(const e of S.en)if(e.hp>tg.hp)tg=e;const d=tg.hp*.1;tg.hp-=d;S.acc+=d;S.dcd=1/st({t:'n',shots:0,o:[]},0).r;S.dz.push({x:tg.x,t:.4});S.beams.push({x:W*.1,ex:tg.x,t:.12,c:'#4dd0e1'});S.fl.push({x:tg.x,y:H-20,t:.6,s:fmt(d),cr:1})}}
S.beams=S.beams.filter(b=>(b.t-=dt)>0);S.ex=S.ex.filter(e=>(e.t-=dt)>0);S.dz=S.dz.filter(e=>(e.t-=dt)>0);S.ls=S.ls.filter(e=>(e.t-=dt)>0);S.fl=S.fl.filter(f=>{f.t-=dt;f.y-=20*dt;return f.t>0})}
function draw(){const dpr=devicePixelRatio||1;W=cv.clientWidth;if(cv.width!=W*dpr){cv.width=W*dpr;cv.height=H*dpr}
cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);
const tm=performance.now()/1000;if(S.ls.length)cx.translate((Math.random()-.5)*6,(Math.random()-.5)*6);
const bg=cx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#1a237e');bg.addColorStop(.5,'#4a148c');bg.addColorStop(1,'#1a237e');cx.fillStyle=bg;cx.fillRect(-5,-5,W+10,H+10);
for(let i=0;i<40;i++){cx.globalAlpha=.3+.7*Math.abs(Math.sin(tm*2+i));cx.fillStyle='#fff';cx.fillRect((i*137.5)%W,(i*53)%H,2,2)}
cx.globalAlpha=.25;cx.fillStyle='#000';cx.fillRect(0,H/2-18,W,36);cx.globalAlpha=.3;cx.fillStyle='#ffee58';for(let x=-((tm*40)%40);x<W;x+=40)cx.fillRect(x,H/2-1,18,2);cx.globalAlpha=1;
const fg='#fff';
cx.fillStyle=fg;cx.font='bold 12px sans-serif';cx.fillText('拠点',4,14);cx.font='bold 20px sans-serif';cx.globalAlpha=.15;cx.fillText('敵が通る通路',W/2-60,H/2+6);cx.globalAlpha=1;
for(const b of S.beams){cx.strokeStyle=b.c||(b.cr?'#ffa726':'#ef5350');cx.lineWidth=b.cr?3:1.5;cx.beginPath();cx.moveTo(b.x,H);cx.lineTo(b.ex,H/2);cx.stroke()}
if(INF())S.cells.forEach((c,i)=>{if(!c||c.t!='s')return;const x=tx(i);for(let k=0;k<5;k++){const ox=x+Math.sin(tm*1.3+k*1.7)*28,oy=H/2+Math.cos(tm*1.1+k*2.3)*12,R=24+Math.sin(tm*2+k)*5;const g=cx.createRadialGradient(ox,oy,0,ox,oy,R);g.addColorStop(0,'rgba(156,204,101,.6)');g.addColorStop(1,'rgba(106,27,154,0)');cx.fillStyle=g;cx.beginPath();cx.arc(ox,oy,R,0,7);cx.fill()}});
for(const e of S.en){const r=e.boss?16:9;cx.fillStyle=e.boss?'#8e24aa':'#e53935';cx.beginPath();cx.arc(e.x,H/2,r,0,7);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(e.x-r*.35,H/2-r*.2,r*.25,0,7);cx.fill();cx.beginPath();cx.arc(e.x+r*.35,H/2-r*.2,r*.25,0,7);cx.fill();cx.fillStyle='#000';cx.fillRect(e.x-r*.45,H/2-r*.25,2,2);cx.fillRect(e.x+r*.25,H/2-r*.25,2,2);
cx.fillStyle='#888';cx.fillRect(e.x-12,H/2-r-8,24,3);cx.fillStyle='#43a047';cx.fillRect(e.x-12,H/2-r-8,24*Math.max(0,e.hp/e.mx),3)}
for(const x of S.ex){const p=1-x.t/.4,R=20+55*p;cx.globalAlpha=Math.max(0,1-p);
const g=cx.createRadialGradient(x.x,H/2,0,x.x,H/2,R);g.addColorStop(0,'#fff59d');g.addColorStop(.5,'#ff9800');g.addColorStop(1,'rgba(229,57,53,0)');
cx.fillStyle=g;cx.beginPath();cx.arc(x.x,H/2,R,0,7);cx.fill();
cx.strokeStyle='#ff5722';cx.lineWidth=3;cx.beginPath();cx.arc(x.x,H/2,R*.9,0,7);cx.stroke();
cx.fillStyle='#ffca28';for(let k=0;k<8;k++){const a=x.a+k*.785,d=R*1.1;cx.fillRect(x.x+Math.cos(a)*d-2,H/2+Math.sin(a)*d-2,4,4)}
cx.globalAlpha=1}
if(S.dt){const X=W*.1;cx.fillStyle='#4dd0e1';cx.strokeStyle='#006064';cx.lineWidth=1.5;cx.beginPath();cx.moveTo(X,H-26);cx.lineTo(X+9,H-14);cx.lineTo(X,H);cx.lineTo(X-9,H-14);cx.closePath();cx.fill();cx.stroke()}
if(S.dt&&INF()&&S.dm.t<=0){cx.font='24px sans-serif';cx.textAlign='center';cx.fillText('💎',W*.3,H/2+8);cx.textAlign='left'}
for(const l of S.ls){cx.globalAlpha=Math.max(0,l.t/.25);cx.strokeStyle='#ff1744';cx.lineWidth=10;cx.beginPath();cx.moveTo(0,H/2);cx.lineTo(l.ex,H/2);cx.stroke();cx.strokeStyle='#fff';cx.lineWidth=4;cx.stroke();cx.globalAlpha=1}
for(const z of S.dz){const p=1-z.t/.4,R=8+22*p;cx.globalAlpha=Math.max(0,1-p);cx.fillStyle='#4dd0e1';cx.beginPath();cx.moveTo(z.x,H/2-R);cx.lineTo(z.x+R*.7,H/2);cx.lineTo(z.x,H/2+R);cx.lineTo(z.x-R*.7,H/2);cx.closePath();cx.fill();cx.strokeStyle='#fff';cx.lineWidth=2;cx.stroke();cx.globalAlpha=1}
for(const p of PT){cx.globalAlpha=Math.max(0,p.t/.6);cx.fillStyle=p.c;cx.fillRect(p.x-2,p.y-2,4,4)}cx.globalAlpha=1;
cx.font='bold 11px sans-serif';cx.textAlign='center';for(const f of S.fl){cx.fillStyle=f.cr?'#ffa726':fg;cx.fillText(f.s,f.x,f.y)}cx.textAlign='left'}
function loop(t){if(TL)sky(t/1000);const dt=Math.min(.05,(t-last)/1000||0);last=t;tick(dt);draw();acc+=dt;if(acc>.3){acc=0;stats()}requestAnimationFrame(loop)}
function stats(){if($('dc'))$('dc').textContent=S.dia+'/10';const m=[[10,'範囲攻撃'],[25,'バフ+5%'],[50,'クリティカル'],[100,'クリ率50%'],[1000,'攻撃力×11'],[5000,'クリ力8000%'],[9999,'攻撃毎+1%'],[10000,'以降+1毎ダメ+10%']];
$('top').innerHTML=`<div>ゴールド<b>${fmt(S.gold)}</b></div><div>ウェーブ<b>${S.wave}</b></div><div>ライフ<b>${S.life}</b></div><div>進化値<b>${fmt(S.evo)}</b></div><div>DPS<b>${fmt(S.dps)}</b></div>`;
$('evo').innerHTML=(S.mode=='inf'?'<b style="color:#e53935">【インフレーション】</b> ':'')+(S.msg?`<b>${S.msg}</b><br>`:'')+m.map(([v,n])=>`<span style="${S.evo>=v?'color:#43a047;font-weight:bold':''}">${v}:${n}</span>`).join(' / ')}
function svg(t){const col={n:'#78909c',s:'#29b6f6',l:'#ffb300',p:'#e53935'}[t];let b='<rect x="6" y="28" width="28" height="8" rx="2" fill="#444"/>';
if(t=='n')b+=`<rect x="13" y="10" width="14" height="19" rx="2" fill="${col}"/><rect x="18" y="1" width="4" height="12" fill="#333"/>`;
if(t=='s')b+=`<circle cx="20" cy="20" r="9" fill="${col}"/><rect x="11" y="5" width="3" height="13" fill="#333"/><rect x="18.5" y="2" width="3" height="16" fill="#333"/><rect x="26" y="5" width="3" height="13" fill="#333"/>`;
if(t=='p')b+=`<polygon points="10,29 30,29 25,10 15,10" fill="${col}"/><rect x="14" y="0" width="12" height="12" rx="2" fill="#333"/><circle cx="20" cy="6" r="3" fill="#ffb300"/>`;
if(t=='l')b+=`<path d="M6 20H34" stroke="#333" stroke-width="3"/><circle cx="20" cy="20" r="8" fill="${col}"/><circle cx="6" cy="20" r="4" fill="${col}" stroke="#333" stroke-width="1.5"/><circle cx="34" cy="20" r="4" fill="${col}" stroke="#333" stroke-width="1.5"/><circle cx="20" cy="20" r="3" fill="#fff"/>`;
return `<svg viewBox="0 0 40 40" width="34" height="34">${b}</svg>`}
function dot(k){return `<i class="${'bf'.includes(k)?'zap':''}" style="background:${O[k].c}">${'bf'.includes(k)?bolt(34,-10):''}</i>`}
function render(){merge();save();stats();$('wv').innerHTML=S.over?'':S.run?'<button disabled style="width:100%;padding:10px">ウェーブ'+S.wave+' 進行中…</button>':'<button onclick="startWave()" style="width:100%;padding:10px;background:#e53935;color:#fff;font-weight:bold">▶ ウェーブ'+(S.wave+1)+' 開始</button>';
$('grid').innerHTML=S.cells.map((c,i)=>`<button class="cell ${S.sel==i?'sel':''}" style="${c?'background:'+({n:'#cfd8dc',s:'#b3e5fc',l:'#ffe082',p:'#ffcdd2'})[c.t]+';color:#111':''}" onclick="selCell(${i})">${c?`${svg(c.t)}<br>${T[c.t].n}<br>ATK ${fmt(st(c,i).d)}`:'タワー<br>配置可能'}</button>`).join('');
const c=S.cells[S.sel];
$('orbs').innerHTML=`オーブ枠<br>(全体効果)<div id="arc">${[0,1,2,3].map(j=>`<button class="slot ${'bf'.includes(S.orb[j]||'-')?'zap':''}" style="${S.orb[j]?'background:'+O[S.orb[j]].c:''}" onclick="unplace(${j})">${'bf'.includes(S.orb[j]||'-')?bolt(60,-15):''}</button>`).join('')}</div><button onclick="diaMark()" style="margin-top:8px;width:100%;padding:4px 2px;font-size:11px">${dtSvg(S.dt)}<br>${S.dt?'ダイヤタワー':'<span id="dc">'+S.dia+'/10</span>'}</button>`;
let p='';
if(S.sel>=0&&!c)p+=`<h4>建てるタワー</h4><div class="row">${Object.keys(T).map(k=>`<button onclick="build('${k}')">${T[k].n}<br><small>${T[k].g}G</small></button>`).join('')}</div><small>連結=隣接タワーごとに攻撃+25%/速度+15%</small>`;
if(c)p+=`<h4>${T[c.t].n}タワー(攻撃${fmt(st(c,S.sel).d)} / 速度${st(c,S.sel).r.toFixed(2)}/秒)</h4><button onclick="sell()">売却(+${Math.floor(T[c.t].g*.7)}G)</button>`;
const full=S.orb.length==4&&S.orb.every(k=>k=='e');p+=`<div>${full?'<button onclick="evolve()">★ 4枠進化(進化値+5)</button>':'<small>オーブ枠(全タワーに効果)。進化オーブ4枠で進化値+5</small>'}</div>`;
if(S.sel<0)p+=`<small>マスをタップしてタワーを建てよう</small>`;
p+=`<h4 style="margin-top:8px">🏠 オーブショップ</h4><div class="row">購入数:${[1,10,100].map(n=>`<button style="${qty==n?'background:#e53935;color:#fff':''}" onclick="qty=${n};render()">×${n}</button>`).join('')}</div><div class="row">${['s','p','e','v'].map(k=>`<button onclick="buy('${k}')"><span class="chip">${dot(k)}${O[k].n}</span><br><small>${O[k].p*qty}G</small></button>`).join('')}</div>`;
p+=`<h4>所持オーブ(タップで枠に装着)</h4><div class="row">${Object.keys(O).filter(k=>'spev'.includes(k)||S.inv[k]>0||(k=='m'&&S.mu)||(k=='g'&&S.gu)).map(k=>`<button onclick="place('${k}')"><span class="chip">${dot(k)}${O[k].n}×${S.inv[k]}</span></button>`).join('')}</div>`;
p+=`<h4>合成</h4><div class="row"><button onclick="synth('m')">進化+パワー+スピード→メガ</button>${S.mu?'<button onclick="synth(\'g\')">メガ×3→ギガ</button>':''}</div><small>スピード+10% / パワー+20% / メガ=速度&攻撃+20%${S.gu?' / ギガ=+80% / ファイナル=+500%':''}<br>ボイド=7%で50倍 / ブラックホール(ボイド4+進化値80)=30%で100倍・20%で即死<br>ブラックホール装着+進化値500以上:敵を倒すたび💎獲得。ダイヤ「10個」でダイヤマークをタップ→ダイヤタワー建設(HPが最も高い敵の現在HPの10%を削る)</small>`;
p+=`<h4 style="margin-top:8px">テスト</h4><div class="row">${[10,25,50,100,500,1000,5000,9999,10999].map(v=>`<button onclick="S.evo=${v};render()">${v}</button>`).join('')}<button onclick="init(S.mode)">リスタート</button><button onclick="suspend()">タイトル</button></div>`;
$('panel').innerHTML=p}
function merge(){const o=S.orb,n=x=>o.filter(y=>y==x).length,rm=x=>o.splice(o.indexOf(x),1);
if(n('g')>=3){rm('g');rm('g');rm('g');o.push('f');toast('ファイナルオーブに合成!')}
if(n('v')>=4&&S.evo>=80){for(let i=0;i<4;i++)rm('v');o.push('b');toast('ブラックホール誕生!')}}
function useDia(){if(S.dia<1)return toast('ダイヤがない(ブラックホール装着+進化値500で入手)');if(!S.en.length)return toast('敵がいない');S.dia--;for(const e of S.en){const d=e.hp*.1;e.hp-=d;S.dz.push({x:e.x,t:.4});S.fl.push({x:e.x,y:H-20,t:.6,s:fmt(d),cr:1})}stats()}
function bolt(s,o){const P=['M30 15L34 9L28 6L33 0','M45 30L51 26L48 33L58 30','M30 45L26 52L32 54L27 60','M15 30L9 34L12 27L2 31','M41 19L47 14L45 20L52 12','M19 41L13 47L19 46L10 53'];return `<svg class="bolt" viewBox="0 0 60 60" width="${s}" height="${s}" style="left:${o}px;top:${o}px">${P.map(d=>`<path d="${d}"/>`).join('')}</svg>`}
function dtSvg(on){return `<svg viewBox="0 0 40 40" width="38" height="38">${on?'<polygon points="20,2 34,16 20,38 6,16" fill="#4dd0e1" stroke="#006064" stroke-width="1.5"/><polygon points="20,2 34,16 20,16" fill="#b2ebf2"/><polygon points="6,16 20,16 20,38" fill="#00acc1"/>':'<polygon points="20,2 34,16 20,38 6,16" fill="none" stroke="#4dd0e1" stroke-width="2" stroke-dasharray="3 3"/>'}</svg>`}
function diaMark(){if(S.dt)return toast('ダイヤタワー稼働中');if(S.dia<10)return toast('ダイヤが足りない('+S.dia+'/10)');S.dia-=10;S.dt=1;S.dcd=0;toast('ダイヤタワー建設!');render()}
function sell(){const c=S.cells[S.sel];if(!c)return;S.gold+=Math.floor(T[c.t].g*.7);S.cells[S.sel]=null;render()}
const SK=m=>'otd_'+m;
function save(){if(TL||!S)return;try{if(S.over){localStorage.removeItem(SK(S.mode));return}const{beams,fl,ex,dz,ls,msg,...r}=S;localStorage.setItem(SK(S.mode),JSON.stringify(r))}catch(e){}}
function getSave(m){try{return JSON.parse(localStorage.getItem(SK(m)))}catch(e){return null}}
function startGame(m,cont){const sv=cont?getSave(m):null;if(!cont){try{localStorage.removeItem(SK(m))}catch(e){}}init(m);if(sv)Object.assign(S,sv,{mode:m});TL=0;$('title').style.display='none';render()}
function suspend(){save();TL=1;showTitle()}

function selCell(i){S.sel=i;render()}
function build(k){const i=S.sel;if(S.gold<T[k].g)return toast('ゴールドが足りない');S.gold-=T[k].g;S.cells[i]={t:k,o:[],shots:0,cd:0};render()}
function buy(k){const c=O[k].p*qty;if(S.gold<c)return toast('ゴールドが足りない');S.gold-=c;S.inv[k]+=qty;render()}

function unplace(j){if(!S.orb[j])return;S.inv[S.orb[j]]++;S.orb.splice(j,1);render()}
function evolve(){if(S.orb.length==4&&S.orb.every(k=>k=='e')){S.orb=[];S.evo+=5;render()}}
function synth(k){const v=S.inv;if(k=='m'){if(v.e<1||v.p<1||v.s<1)return toast('進化・パワー・スピードが各1必要');v.e--;v.p--;v.s--;v.m++;S.mu=1}else{if(v.m<3)return toast('メガが3つ必要');v.m-=3;v.g++;S.gu=1}render()}
